<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>电池安全巡检看板</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #ffffff;
      color: #1a1a1a;
      padding: 24px;
    }

    /* ── 顶部总结栏 ── */
    .summary-bar {
      background: linear-gradient(135deg, #1a6b3c 0%, #2e9e5b 100%);
      color: #fff;
      border-radius: 12px;
      padding: 20px 32px;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 16px rgba(26,107,60,0.18);
    }
    .summary-bar .title-block h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .summary-bar .title-block p {
      font-size: 13px;
      opacity: 0.85;
      margin-top: 4px;
    }
    .summary-bar .counter-block {
      text-align: center;
      background: rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 12px 28px;
      min-width: 200px;
    }
    .summary-bar .counter-block .week-num {
      font-size: 48px;
      font-weight: 800;
      line-height: 1;
    }
    .summary-bar .counter-block .week-label {
      font-size: 14px;
      opacity: 0.9;
      margin-top: 4px;
    }
    .summary-bar .rule-block {
      font-size: 12px;
      line-height: 1.9;
      opacity: 0.9;
      max-width: 340px;
    }
    .summary-bar .rule-block strong {
      font-size: 13px;
      display: block;
      margin-bottom: 4px;
    }

    /* ── 操作栏 ── */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .toolbar label {
      font-size: 13px;
      color: #555;
    }
    .toolbar input[type="text"] {
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
      width: 120px;
    }
    .toolbar button {
      background: #2e9e5b;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 7px 16px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .toolbar button:hover { background: #1a6b3c; }
    .toolbar button.secondary {
      background: #f0f0f0;
      color: #333;
    }
    .toolbar button.secondary:hover { background: #ddd; }

    /* ── 成员管理 ── */
    .members-section {
      background: #f9f9f9;
      border: 1px solid #eee;
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 20px;
    }
    .members-section h3 {
      font-size: 14px;
      color: #444;
      margin-bottom: 10px;
    }
    .members-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .member-tag {
      background: #e8f5ee;
      border: 1px solid #b2d8c0;
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .member-tag .remove-btn {
      cursor: pointer;
      color: #999;
      font-size: 16px;
      line-height: 1;
    }
    .member-tag .remove-btn:hover { color: #c00; }

    /* ── 主表格 ── */
    .table-wrapper {
      overflow-x: auto;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
      font-size: 13.5px;
    }
    thead tr {
      background: #1a6b3c;
      color: #fff;
    }
    thead th {
      padding: 13px 10px;
      text-align: center;
      font-weight: 600;
      white-space: nowrap;
    }
    thead th:first-child { text-align: left; padding-left: 16px; }

    tbody tr { border-bottom: 1px solid #f0f0f0; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #f6fdf9; }

    /* 过去的行颜色 */
    tbody tr.past { background: #fafafa; }
    tbody tr.past td { color: #aaa; }

    /* 当前周高亮 */
    tbody tr.current-week {
      background: #fffbe6;
      border-left: 4px solid #f5a623;
    }
    tbody tr.current-week td { font-weight: 500; }

    td {
      padding: 11px 10px;
      vertical-align: middle;
      text-align: center;
    }
    td:first-child { text-align: left; padding-left: 16px; }

    .date-cell { white-space: nowrap; }
    .date-cell .weekday { font-size: 11px; color: #999; display: block; }

    .person-cell {
      font-weight: 600;
      color: #1a6b3c;
      white-space: nowrap;
    }

    /* 复选框列 */
    .check-cell { text-align: center; }
    .check-wrap {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    .check-wrap input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #2e9e5b;
    }
    .check-wrap .check-time {
      font-size: 10px;
      color: #888;
    }

    /* 确认状态列 */
    .status-cell .status-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-badge.done { background: #d4edda; color: #1a6b3c; }
    .status-badge.partial { background: #fff3cd; color: #856404; }
    .status-badge.pending-s { background: #f8f9fa; color: #999; border: 1px solid #ddd; }
    .status-badge.violation { background: #f8d7da; color: #721c24; }

    /* 备注列 */
    .remark-cell textarea {
      width: 100%;
      min-width: 160px;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 12px;
      resize: vertical;
      min-height: 32px;
      color: #333;
      font-family: inherit;
    }
    .remark-cell textarea:focus {
      outline: none;
      border-color: #2e9e5b;
      box-shadow: 0 0 0 2px rgba(46,158,91,0.15);
    }
    .remark-cell textarea::placeholder { color: #ccc; }

    /* 月份分隔行 */
    tr.month-divider td {
      background: #f0f7f3;
      color: #1a6b3c;
      font-weight: 700;
      font-size: 13px;
      padding: 8px 16px;
      text-align: left;
      letter-spacing: 1px;
    }

    /* ── 底部说明 ── */
    .legend {
      margin-top: 20px;
      padding: 14px 20px;
      background: #f9f9f9;
      border-radius: 8px;
      font-size: 12px;
      color: #777;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .legend-dot {
      width: 10px; height: 10px; border-radius: 50%;
    }

    /* ── 弹窗提示 ── */
    .toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: #1a6b3c;
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      z-index: 999;
    }
    .toast.show { opacity: 1; }

    /* 响应式 */
    @media (max-width: 700px) {
      .summary-bar { flex-direction: column; gap: 14px; }
      .summary-bar .rule-block { display: none; }
      .summary-bar .counter-block { min-width: unset; }
    }
  </style>
</head>
<body>

<!-- 顶部总结栏 -->
<div class="summary-bar">
  <div class="title-block">
    <h1>电池安全巡检看板</h1>
    <p>每周五下班前完成巡检 &nbsp;|&nbsp; 从 2026年8月7日 起执行</p>
  </div>
  <div class="counter-block">
    <div class="week-num" id="safeWeekCount">0</div>
    <div class="week-label">截至本周&nbsp;·&nbsp;连续安全运行周数</div>
  </div>
  <div class="rule-block">
    <strong>三项检查内容</strong>
    ① 高风险电池放入防爆柜（裸漏电芯 / 拆壳电池）<br/>
    ② 低风险电池下班前拔掉电源<br/>
    ③ 防爆柜：高低风险分开存放、无人值守不充电、柜门前无杂物
  </div>
</div>

<!-- 成员管理 -->
<div class="members-section">
  <h3>成员列表（共 <span id="memberCount">0</span> 人，点击 × 可删除，支持添加新成员）</h3>
  <div class="members-list" id="membersList"></div>
  <div class="toolbar" style="margin-top:10px; margin-bottom:0;">
    <input type="text" id="newMemberInput" placeholder="输入姓名" maxlength="10" />
    <button onclick="addMember()">+ 添加成员</button>
    <button class="secondary" onclick="resetData()">重置所有数据</button>
    <button class="secondary" onclick="exportCSV()">导出 CSV</button>
  </div>
</div>

<!-- 主表格 -->
<div class="table-wrapper">
  <table id="mainTable">
    <thead>
      <tr>
        <th style="width:90px">巡检日期</th>
        <th style="width:90px">值班成员</th>
        <th>① 高风险电池<br/><span style="font-weight:400;font-size:11px">放入防爆柜</span></th>
        <th>② 低风险电池<br/><span style="font-weight:400;font-size:11px">拔掉电源</span></th>
        <th>③ 防爆柜管理<br/><span style="font-weight:400;font-size:11px">分开放置·无杂物</span></th>
        <th style="width:80px">确认状态</th>
        <th style="min-width:180px">违规备注</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<!-- 图例 -->
<div class="legend">
  <div class="legend-item">
    <div class="legend-dot" style="background:#fffbe6; border:2px solid #f5a623;"></div>
    <span>当前周（本周五）</span>
  </div>
  <div class="legend-item">
    <div class="legend-dot" style="background:#d4edda;"></div>
    <span>全部通过</span>
  </div>
  <div class="legend-item">
    <div class="legend-dot" style="background:#fff3cd;"></div>
    <span>部分完成</span>
  </div>
  <div class="legend-item">
    <div class="legend-dot" style="background:#f8d7da;"></div>
    <span>有违规备注</span>
  </div>
  <div class="legend-item">
    <div class="legend-dot" style="background:#f8f9fa; border:1px solid #ddd;"></div>
    <span>待确认</span>
  </div>
  <div style="margin-left:auto; color:#aaa; font-size:11px;" id="syncStatus">正在连接云端…</div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── 常量 ──
const START_DATE = new Date(2026, 7, 7); // 2026-08-07 周五
const WEEKS_TO_SHOW = 52;

// 节假日调整：key=原周五日期, value=实际巡检日期
const DATE_OVERRIDES = {
  '2026-10-02': '2026-09-30' // 国庆节提前至9月30日
};

const DEFAULT_MEMBERS = [
  'jammy.wang','kyle.wen','simon.chen','siyi.teng','sorin.li','tina.chen',
  'wensy.xie','zhengxi.wang','peter.zhu','chenhao.ye','erik.lu','jackson.ding'
];

// ── JSONBin.io 配置 ──
const JSONBIN_BIN_ID = '6a967dfef5f4af5e295b3ad5';
const JSONBIN_API_KEY = '$2a$10$APvnwrNq4oc3Sk7qKJxki.Fx7RWOid/kOv4cZRKytlvcNFfe3gbNi';

// ── 内存数据 ──
let appData = { members: [...DEFAULT_MEMBERS], rows: {} };
let isSaving = false;
let pollTimer = null;

// ── JSONBin API ──
async function fetchData() {
  if (!JSONBIN_BIN_ID || !JSONBIN_API_KEY) return null;
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
      headers: { 'X-Master-Key': JSONBIN_API_KEY }
    });
    if (!res.ok) return null;
    const json = await res.json();
    return json.record;
  } catch(e) { return null; }
}

async function pushData() {
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': JSONBIN_API_KEY
      },
      body: JSON.stringify(appData)
    });
    return res.ok;
  } catch(e) { return false; }
}

function setSyncStatus(msg, color) {
  const el = document.getElementById('syncStatus');
  if (el) { el.textContent = msg; el.style.color = color || '#aaa'; }
}

// ── 初始化：加载云端数据 ──
async function initData() {
  setSyncStatus('同步中…', '#999');
  const remote = await fetchData();
  if (remote && remote.rows !== undefined) {
    appData = remote;
    setSyncStatus('✓ 已同步 ' + nowStr(), '#2e9e5b');
  } else {
    setSyncStatus('⚠️ 读取失败，使用本地', '#e67e22');
  }
  renderMembers();
  renderTable();
  updateSafeWeeks();
  startPolling();
}

// ── 定时轮询（30秒） ──
function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    if (isSaving) return;
    const remote = await fetchData();
    if (remote && remote.rows !== undefined) {
      appData = remote;
      setSyncStatus('✓ 已同步 ' + nowStr(), '#2e9e5b');
      renderMembers();
      renderTable();
      updateSafeWeeks();
    }
  }, 30000);
}

function nowStr() {
  const d = new Date();
  return `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
}

// ── 保存 ──
async function saveData() {
  isSaving = true;
  setSyncStatus('保存中…', '#999');
  const ok = await pushData();
  setSyncStatus(ok ? '✓ 已保存 ' + nowStr() : '⚠️ 保存失败', ok ? '#2e9e5b' : '#c0392b');
  isSaving = false;
}

// ── 日期工具 ──
function getFridays(startDate, count) {
  const fridays = [];
  let d = new Date(startDate);
  for (let i = 0; i < count; i++) {
    fridays.push(new Date(d));
    d.setDate(d.getDate() + 7);
  }
  return fridays;
}

function formatDate(d) {
  const m = d.getMonth() + 1;
  const day = d.getDate();
  return `${d.getFullYear()}/${m < 10 ? '0'+m : m}/${day < 10 ? '0'+day : day}`;
}

function dateKey(d) {
  return formatDate(d).replace(/\//g, '-');
}

function isCurrentWeekFriday(d) {
  const today = new Date();
  const dow = today.getDay();
  const diff = 5 - dow;
  const thisFri = new Date(today);
  thisFri.setDate(today.getDate() + diff);
  thisFri.setHours(0,0,0,0);
  const target = new Date(d);
  target.setHours(0,0,0,0);
  return thisFri.getTime() === target.getTime();
}

function isPast(d) {
  const today = new Date();
  today.setHours(0,0,0,0);
  const target = new Date(d);
  target.setHours(0,0,0,0);
  return target < today;
}

// ── 计算安全运行周数 ──
function calcSafeWeeks() {
  const fridays = getFridays(START_DATE, WEEKS_TO_SHOW);
  const today = new Date();
  today.setHours(0,0,0,0);
  let safeWeeks = 0;

  for (let i = 0; i < fridays.length; i++) {
    const fri = new Date(fridays[i]);
    fri.setHours(0,0,0,0);
    if (fri > today) break;
    const key = dateKey(fri);
    const row = appData.rows[key];
    if (!row) continue;
    const allChecked = row.c1 && row.c2 && row.c3;
    const hasViolation = row.remark && row.remark.trim().length > 0;
    if (allChecked && !hasViolation) {
      safeWeeks++;
    } else {
      safeWeeks = 0;
    }
  }
  return safeWeeks;
}

// ── 渲染成员列表 ──
function renderMembers() {
  const list = document.getElementById('membersList');
  const countEl = document.getElementById('memberCount');
  list.innerHTML = '';
  appData.members.forEach((name, idx) => {
    const tag = document.createElement('div');
    tag.className = 'member-tag';
    tag.innerHTML = `<span>${idx+1}. ${name}</span><span class="remove-btn" title="删除" onclick="removeMember(${idx})">×</span>`;
    list.appendChild(tag);
  });
  countEl.textContent = appData.members.length;
}

// ── 渲染表格 ──
function renderTable() {
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';
  const fridays = getFridays(START_DATE, WEEKS_TO_SHOW);
  const members = appData.members;
  if (members.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#999;padding:30px">请先添加成员</td></tr>';
    return;
  }

  let lastMonth = -1;

  fridays.forEach((fri, idx) => {
    const month = fri.getMonth() + 1;
    const year = fri.getFullYear();

    if (month !== lastMonth) {
      const divRow = document.createElement('tr');
      divRow.className = 'month-divider';
      divRow.innerHTML = `<td colspan="7">${year}年 ${month}月</td>`;
      tbody.appendChild(divRow);
      lastMonth = month;
    }

    const key = dateKey(fri);
    const overrideStr = DATE_OVERRIDES[key];
    const displayDate = overrideStr ? new Date(overrideStr) : fri;
    const row = appData.rows[key] || { c1: false, c2: false, c3: false, remark: '', ct1: '', ct2: '', ct3: '' };
    const person = members[idx % members.length];

    const isCurrent = isCurrentWeekFriday(fri);
    const past = isPast(fri) && !isCurrent;

    const tr = document.createElement('tr');
    if (isCurrent) tr.classList.add('current-week');
    else if (past) tr.classList.add('past');

    const allDone = row.c1 && row.c2 && row.c3;
    const anyDone = row.c1 || row.c2 || row.c3;
    const hasRemark = row.remark && row.remark.trim().length > 0;

    let badge = '';
    if (hasRemark) {
      badge = '<span class="status-badge violation">有违规</span>';
    } else if (allDone) {
      badge = '<span class="status-badge done">全部通过</span>';
    } else if (anyDone) {
      badge = '<span class="status-badge partial">部分完成</span>';
    } else {
      badge = '<span class="status-badge pending-s">待确认</span>';
    }

    const dayNames = ['日','一','二','三','四','五','六'];

    tr.innerHTML = `
      <td class="date-cell">
        ${displayDate.getMonth()+1}/${displayDate.getDate()}
        <span class="weekday">周${dayNames[displayDate.getDay()]}${overrideStr ? '&nbsp;<span style="color:#e67e22;font-size:10px;">调休</span>' : ''}</span>
      </td>
      <td class="person-cell">${escHtml(person)}</td>
      <td class="check-cell">
        <div class="check-wrap">
          <input type="checkbox" id="c1_${key}" ${row.c1 ? 'checked' : ''} onchange="onCheck('${key}','c1',this)" />
          <span class="check-time" id="ct1_${key}">${row.ct1 || ''}</span>
        </div>
      </td>
      <td class="check-cell">
        <div class="check-wrap">
          <input type="checkbox" id="c2_${key}" ${row.c2 ? 'checked' : ''} onchange="onCheck('${key}','c2',this)" />
          <span class="check-time" id="ct2_${key}">${row.ct2 || ''}</span>
        </div>
      </td>
      <td class="check-cell">
        <div class="check-wrap">
          <input type="checkbox" id="c3_${key}" ${row.c3 ? 'checked' : ''} onchange="onCheck('${key}','c3',this)" />
          <span class="check-time" id="ct3_${key}">${row.ct3 || ''}</span>
        </div>
      </td>
      <td class="status-cell" id="status_${key}">${badge}</td>
      <td class="remark-cell">
        <textarea rows="1" placeholder="如有违规请填写具体情况…" id="remark_${key}" onchange="onRemark('${key}',this)">${escHtml(row.remark || '')}</textarea>
      </td>
    `;
    tbody.appendChild(tr);
  });

  const currentRow = tbody.querySelector('.current-week');
  if (currentRow) {
    setTimeout(() => currentRow.scrollIntoView({ behavior: 'smooth', block: 'center' }), 200);
  }
}

// ── 更新安全周数 ──
function updateSafeWeeks() {
  document.getElementById('safeWeekCount').textContent = calcSafeWeeks();
}

// ── 复选框事件 ──
function onCheck(key, field, el) {
  if (!appData.rows[key]) appData.rows[key] = { c1:false, c2:false, c3:false, remark:'', ct1:'', ct2:'', ct3:'' };
  appData.rows[key][field] = el.checked;

  const timeField = field.replace('c','ct');
  const now = new Date();
  const ts = el.checked
    ? `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`
    : '';
  appData.rows[key][timeField] = ts;

  const tsEl = document.getElementById(timeField + '_' + key);
  if (tsEl) tsEl.textContent = ts;

  updateStatusBadge(key);
  updateSafeWeeks();
  saveData();
  showToast('已保存');
}

// ── 备注事件 ──
function onRemark(key, el) {
  if (!appData.rows[key]) appData.rows[key] = { c1:false, c2:false, c3:false, remark:'', ct1:'', ct2:'', ct3:'' };
  appData.rows[key].remark = el.value;
  updateStatusBadge(key);
  updateSafeWeeks();
  saveData();
  showToast('已保存');
}

// ── 更新状态徽章 ──
function updateStatusBadge(key) {
  const row = appData.rows[key] || {};
  const allDone = row.c1 && row.c2 && row.c3;
  const anyDone = row.c1 || row.c2 || row.c3;
  const hasRemark = row.remark && row.remark.trim().length > 0;
  const el = document.getElementById('status_' + key);
  if (!el) return;

  let badge = '';
  if (hasRemark) {
    badge = '<span class="status-badge violation">有违规</span>';
  } else if (allDone) {
    badge = '<span class="status-badge done">全部通过</span>';
  } else if (anyDone) {
    badge = '<span class="status-badge partial">部分完成</span>';
  } else {
    badge = '<span class="status-badge pending-s">待确认</span>';
  }
  el.innerHTML = badge;
}

// ── 添加成员 ──
function addMember() {
  const input = document.getElementById('newMemberInput');
  const name = input.value.trim();
  if (!name) { showToast('请输入姓名'); return; }
  if (appData.members.includes(name)) { showToast('姓名已存在'); return; }
  appData.members.push(name);
  input.value = '';
  renderMembers();
  renderTable();
  updateSafeWeeks();
  saveData();
  showToast(`已添加成员：${name}`);
}

// ── 删除成员 ──
function removeMember(idx) {
  const name = appData.members[idx];
  if (!confirm(`确认删除成员「${name}」？\n删除后排班顺序将自动更新。`)) return;
  appData.members.splice(idx, 1);
  renderMembers();
  renderTable();
  updateSafeWeeks();
  saveData();
  showToast(`已删除：${name}`);
}

document.getElementById('newMemberInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') addMember();
});

// ── 重置数据 ──
function resetData() {
  if (!confirm('确认重置所有巡检数据？此操作不可撤销。')) return;
  appData = { members: [...DEFAULT_MEMBERS], rows: {} };
  renderMembers();
  renderTable();
  updateSafeWeeks();
  saveData();
  showToast('数据已重置');
}

// ── 导出 CSV ──
function exportCSV() {
  const fridays = getFridays(START_DATE, WEEKS_TO_SHOW);
  const members = appData.members;
  const rows = [['日期','值班人','高风险电池','低风险电池','防爆柜管理','确认时间1','确认时间2','确认时间3','备注']];

  fridays.forEach((fri, idx) => {
    const key = dateKey(fri);
    const row = appData.rows[key] || {};
    const person = members[idx % members.length];
    rows.push([
      formatDate(fri), person,
      row.c1 ? '已确认' : '未确认',
      row.c2 ? '已确认' : '未确认',
      row.c3 ? '已确认' : '未确认',
      row.ct1 || '', row.ct2 || '', row.ct3 || '',
      row.remark || ''
    ]);
  });

  const csv = '\uFEFF' + rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `电池安全巡检记录_${formatDate(new Date()).replace(/\//g,'-')}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('CSV 已导出');
}

// ── Toast ──
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

// ── 工具 ──
function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── 启动 ──
initData();
</script>
